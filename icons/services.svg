<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Orange) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9626"/>
      <stop offset="45%" stop-color="#FF7200"/>
      <stop offset="100%" stop-color="#D94000"/>
    </linearGradient>

    <!-- Top Gloss Overlay -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadow for Briefcase -->
    <filter id="briefcaseShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#5E1600" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#801E00" flood-opacity="0.3"/>
    </filter>

    <!-- Drop Shadow for Lid Flap -->
    <filter id="lidShadow" x="-20%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#732B00" flood-opacity="0.45"/>
    </filter>

    <!-- Inset Shadow for Clasp Recess -->
    <filter id="claspRecess" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#521B00" flood-opacity="0.6"/>
    </filter>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEAD1"/>
      <stop offset="50%" stop-color="#FFC588"/>
      <stop offset="100%" stop-color="#FFA443"/>
    </linearGradient>

    <!-- Briefcase Upper Flap Gradient -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E5"/>
      <stop offset="40%" stop-color="#FFDAA8"/>
      <stop offset="100%" stop-color="#FFAF54"/>
    </linearGradient>

    <!-- Briefcase Lower Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC57E"/>
      <stop offset="60%" stop-color="#FF9D38"/>
      <stop offset="100%" stop-color="#ED740C"/>
    </linearGradient>

    <!-- Clasp Button Gradient -->
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE1B3"/>
      <stop offset="100%" stop-color="#FFA845"/>
    </linearGradient>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Specular Rim/Gloss Overlay -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#glossGrad)" pointer-events="none"/>

  <!-- Main Briefcase Group with Drop Shadow -->
  <g filter="url(#briefcaseShadow)">

    <!-- Handle -->
    <path d="M 200 185 V 152 C 200 132 216 116 236 116 H 276 C 296 116 312 132 312 152 V 185 Z" fill="url(#handleGrad)"/>
    <path d="M 226 185 V 158 C 226 147 235 138 246 138 H 266 C 277 138 286 147 286 158 V 185 Z" fill="#D45C00"/>

    <!-- Briefcase Lower Body -->
    <rect x="110" y="240" width="292" height="150" rx="36" fill="url(#bodyGrad)"/>
    <path d="M 140 382 C 200 388 312 388 372 382" stroke="#FFE3BE" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Briefcase Upper Flap -->
    <g filter="url(#lidShadow)">
      <path d="M 110 216 C 110 196 126 180 146 180 H 366 C 386 180 402 196 402 216 V 266 C 402 278 392 288 380 288 H 132 C 120 288 110 278 110 266 Z" fill="url(#lidGrad)"/>
      <path d="M 146 182 H 366" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Clasp / Lock Notch -->
    <rect x="232" y="266" width="48" height="46" rx="12" fill="#7A2D00" filter="url(#claspRecess)"/>
    <rect x="236" y="270" width="40" height="38" rx="9" fill="url(#claspGrad)"/>
    <rect x="240" y="274" width="32" height="30" rx="6" fill="none" stroke="#FFF5E5" stroke-width="1.5" opacity="0.7"/>

  </g>
</svg>
